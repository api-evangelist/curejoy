name: Curejoy
description: 'CureJoy is a consumer health and wellness media company that publishes expert-reviewed
  content on alternative health, natural remedies, fitness, nutrition, and beauty. Backed by Accel,
  it grew into one of the larger natural-health content platforms, distributing articles and advice
  through its website and social channels. The public property is a WordPress.com-hosted content
  site with no first-party developer or product API; the only programmatic surface is the standard
  WordPress REST API (wp-json) exposed by the hosting platform, which is generic infrastructure
  rather than a published product offering.'
